<text x="24.0" y="732.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#42566b" font-weight="normal" text-anchor="start">Les deux pages ne se parlent pas : chacune lit le meme etat partage (DataProvider, figure 1) et c'est l'etat qui rend les donnees solidaires.</text>
